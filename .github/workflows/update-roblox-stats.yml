name: Update Roblox Stats

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-roblox-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Record run context
        id: context
        shell: bash
        run: |
          london_time="$(TZ=Europe/London date --iso-8601=seconds)"
          echo "london_time=$london_time" >> "$GITHUB_OUTPUT"
          {
            echo "# Roblox Stats Refresh"
            echo
            echo "- Trigger: ${{ github.event_name }}"
            echo "- London time: $london_time"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record runtime
        shell: bash
        run: |
          echo "Node version: $(node --version)"
          echo "- Node: $(node --version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check Roblox API connectivity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { lookup } from "node:dns/promises";

          const stats = JSON.parse(await readFile("content/roblox-stats.json", "utf8"));
          const universeId = Object.values(stats).find((entry) =>
            Number.isSafeInteger(entry.robloxUniverseId)
          )?.robloxUniverseId;
          if (!universeId) throw new Error("No Roblox universe ID is configured");

          const dnsResult = await lookup("games.roblox.com");
          console.log(`DNS resolved: games.roblox.com -> ${dnsResult.address}`);

          const endpoint = `https://games.roblox.com/v1/games?universeIds=${universeId}`;
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 15_000);
          try {
            const response = await fetch(endpoint, {
              headers: { accept: "application/json" },
              signal: controller.signal
            });
            console.log(`Roblox endpoint status: ${response.status} (${endpoint})`);
            if (!response.ok) throw new Error(`Roblox endpoint returned HTTP ${response.status}`);
          } finally {
            clearTimeout(timer);
          }
          NODE

      - name: Refresh Roblox stats
        run: npm run update:stats

      - name: Check changed files
        id: changes
        shell: bash
        run: |
          mapfile -t changed_files < <(
            { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "files=None" >> "$GITHUB_OUTPUT"
            echo "No content changes; commit and deployment are skipped."
            exit 0
          fi

          printf 'Changed file: %s\n' "${changed_files[@]}"
          for file in "${changed_files[@]}"; do
            if [[ "$file" != "content/roblox-stats.json" ]]; then
              echo "Unexpected file changed: $file" >&2
              exit 1
            fi
          done

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "files=${changed_files[*]}" >> "$GITHUB_OUTPUT"

      - name: Lint
        if: steps.changes.outputs.has_changes == 'true'
        run: npm run lint

      - name: Test
        if: steps.changes.outputs.has_changes == 'true'
        run: npm test

      - name: Build
        if: steps.changes.outputs.has_changes == 'true'
        run: npm run build

      - name: Recheck changed files after validation
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          mapfile -t changed_files < <(
            { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u
          )
          if (( ${#changed_files[@]} != 1 )) || [[ "${changed_files[0]}" != "content/roblox-stats.json" ]]; then
            printf 'Unexpected post-validation changes:\n%s\n' "${changed_files[*]}" >&2
            exit 1
          fi
          git diff --check

      - name: Commit and push
        id: commit
        if: steps.changes.outputs.has_changes == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          baseline_sha="$(git rev-parse HEAD)"
          git fetch origin "$DEFAULT_BRANCH"
          remote_sha="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          if [[ "$remote_sha" != "$baseline_sha" ]]; then
            echo "Default branch advanced from $baseline_sha to $remote_sha; refusing to overwrite it." >&2
            exit 1
          fi

          git config user.name "risingblox-stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- content/roblox-stats.json
          git commit -m "Refresh Roblox stats"
          commit_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo "sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "Pushed commit $commit_sha to $DEFAULT_BRANCH."

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "- Games configured: $(node -e 'const s=require("./content/roblox-stats.json"); console.log(Object.keys(s).length)')"
            echo "- Files changed: ${{ steps.changes.outputs.files || 'Unknown (workflow stopped before change detection)' }}"
            if [[ "${{ steps.changes.outputs.has_changes }}" == "true" ]]; then
              echo "- Validation: lint, tests, and build passed before commit"
              echo "- Commit: ${{ steps.commit.outputs.sha || 'Not created' }}"
              echo "- Deployment trigger: Git push to the default branch"
            elif [[ "${{ steps.changes.outputs.has_changes }}" == "false" ]]; then
              echo "- Validation: skipped because data did not change"
              echo "- Commit: skipped"
              echo "- Deployment trigger: skipped"
            else
              echo "- Result: failed before change detection completed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
